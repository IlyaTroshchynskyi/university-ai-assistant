services:
  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"  # REST API + web dashboard (http://localhost:6333/dashboard)
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage

  dynamodb:
    # The digest of the :latest built 2026-01-19, the one the tests pass on. Swap it for a version tag
    # once Docker Hub shows which one that is.
    image: amazon/dynamodb-local@sha256:d89f8fcc6b1a39cb35976c248ed42a28c66ae00dc043099210f5571e42648ab4
    container_name: dynamodb
    restart: unless-stopped
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "./data"]
    working_dir: /home/dynamodblocal
    user: root  # needed so the process can write to the mounted ./data volume
    ports:
      - "8001:8000"
    volumes:
      - dynamodb_storage:/home/dynamodblocal/data

volumes:
  qdrant_storage:
  dynamodb_storage:
