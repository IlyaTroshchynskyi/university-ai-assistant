services:
  qdrant:
    image: qdrant/qdrant:latest  # pin to a specific tag (e.g. v1.12.4) for reproducible builds
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"  # REST API + web dashboard (http://localhost:6333/dashboard)
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
