services:
  qdrant:
    image: qdrant/qdrant:latest  # pin to a specific tag (e.g. v1.12.4) for reproducible builds
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"  # REST API + web dashboard (http://localhost:6333/dashboard)
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage

  dynamodb:
    image: amazon/dynamodb-local:latest  # pin to a specific tag for reproducible builds
    container_name: dynamodb
    restart: unless-stopped
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "./data"]
    working_dir: /home/dynamodblocal
    user: root  # needed so the process can write to the mounted ./data volume
    ports:
      - "8001:8000"
    volumes:
      - dynamodb_storage:/home/dynamodblocal/data

volumes:
  qdrant_storage:
  dynamodb_storage:
