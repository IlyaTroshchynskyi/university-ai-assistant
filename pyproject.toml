[project]
name = "crewai-university-assistant"
version = "0.1.0"
description = "University assistant using crewAI"
requires-python = ">=3.11,<3.14"
dependencies = [
    "crewai[tools]>=1.15.1,<2.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "ruff>=0.15.20",
    "pydantic-settings>=2.10.1",
    "qdrant-client>=1.18.0",
    "pdfplumber>=0.11.10",
    "langchain-text-splitters>=1.1.2",
    "fastembed>=0.8.0",
    "aiobotocore>=3.8.0",
    "boto3>=1.43.46",
    "numpy>=2.0.0",
    "pymupdf4llm>=0.2.9",
    "pydantic[email]>=2.12.5",
    # Runtime, not just typing: base_service.py and api/v1/rooms/repository.py import DynamoDBClient
    # unguarded, and FastAPI resolves `Annotated[DynamoDBClient, Depends(...)]` at request time.
    "types-aiobotocore[dynamodb]>=3.7.0",
]

[project.scripts]
kickoff = "app.ai_assistant.main:kickoff"
run_crew = "app.ai_assistant.main:kickoff"
plot = "app.ai_assistant.main:plot"
run_with_trigger = "app.ai_assistant.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.crewai]
type = "flow"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"


[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.ruff.lint]
select = [
    "E", # Errors
    "F", # Pyflakes
    "I", # isort
    "T20", # flake8-print
]
pydocstyle.convention = 'google'

[tool.ruff.lint.isort]
known-local-folder = ["tests", "app", "scripts"]
split-on-trailing-comma = true
combine-as-imports = true
case-sensitive = false
detect-same-package = true
order-by-type = false  # Sorting of all imported objects (functions, classes, etc.) regardless of their type
force-sort-within-sections = true  # Don't sort straight-style imports before from-style imports.

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "polyfactory>=3.3.0",  # tests/factories only — never imported by app/
]
